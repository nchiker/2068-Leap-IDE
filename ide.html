<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leap V2 IDE</title>
  <link rel="stylesheet" href="ide.css">
  <script>
    // The theme before the first paint, so a light theme never flashes dark.
    // The choice (light | dark; none = follow the system) is ide.js "Theme"; keep the two in step.
    (function () {
      var t = null;
      try { t = localStorage.getItem('leap-ide.theme'); } catch (e) { /* storage blocked */ }
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <!-- TSRun (ES modules) is imported by src/emulator.js through the ./tsrun link -->
</head>
<body>

<div class="ide-root">

  <!-- ═══ TOOLBAR ══════════════════════════════════════════════════ -->
  <header class="toolbar">
    <div class="toolbar-logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-name">Leap V2 IDE</span>
      <span class="logo-tag">TS2068</span>
    </div>

    <div class="toolbar-file">
      <span id="filename-display" title="Click to rename">untitled.leap</span><span id="dirty-mark" title="Not saved to a file" hidden> •</span>
      <button class="phbtn" id="btn-new"  title="New program">New</button>
      <button class="phbtn" id="btn-open" title="Open a .leap / .txt program or a Leap .tap (Ctrl+O)">Open</button>
      <span class="menu-anchor">
        <button class="phbtn" id="btn-examples" title="Open one of the example programs" aria-haspopup="menu" aria-expanded="false">Examples ▾</button>
        <div class="menu" id="examples-menu" role="menu" hidden></div>
      </span>
      <button class="phbtn" id="btn-save" title="Save the program as a text file (Ctrl+S)">Save</button>
      <button class="phbtn" id="btn-share" title="Copy a link that opens this program in the IDE">Share</button>
      <input type="file" id="file-input" accept=".leap,.txt,.bas,.tap" hidden>
    </div>

    <div class="toolbar-actions">
      <button id="btn-run"    class="btn btn-run"   title="Run (F5)">▶ Run</button>
      <button id="btn-stop"   class="btn btn-stop"  title="Stop (F6)" disabled>■ Stop</button>
      <button id="btn-pause"  class="btn"           title="Pause / Continue (F8)" disabled>⏸ Pause</button>
      <button id="btn-step"   class="btn"           title="Step to the next statement (F10)" disabled>↷ Step</button>
      <button id="btn-export" class="btn"           title="Save the program as a .tap for Leap's LOAD">⬇ TAP</button>
      <button id="btn-dck"    class="btn"           title="Save the program as a cartridge (.dck) that runs on a stock TS2068">⬇ DCK</button>
      <button id="btn-help"   class="btn"           title="Keywords, keys and tips (F1)">? Help</button>
      <button id="btn-theme"  class="btn btn-theme" title="Switch between light and dark">☾</button>
    </div>

    <div class="status-chip" id="status-chip">
      <span class="status-dot"></span>
      <span id="status-text">Ready</span>
    </div>
  </header>

  <!-- ═══ WORKSPACE ════════════════════════════════════════════════ -->
  <div class="workspace">

    <!-- ── EDITOR PANEL ───────────────────────── -->
    <div class="panel panel-editor" id="editor-panel">
      <div class="panel-header">
        <span>Editor</span>
        <div class="panel-header-btns">
          <button class="phbtn edbtn" id="btn-undo"  title="Undo (Ctrl+Z)" disabled>Undo</button>
          <button class="phbtn edbtn" id="btn-redo"  title="Redo (Ctrl+Y)" disabled>Redo</button>
          <span class="phbtn-sep"></span>
          <button class="phbtn edbtn" id="btn-cut"   title="Cut (Ctrl+X)">Cut</button>
          <button class="phbtn edbtn" id="btn-copy"  title="Copy (Ctrl+C)">Copy</button>
          <button class="phbtn edbtn" id="btn-paste" title="Paste (Ctrl+V)">Paste</button>
          <span class="phbtn-sep"></span>
          <button class="phbtn edbtn" id="btn-find"  title="Find and replace (Ctrl+F, Ctrl+H)">Find</button>
          <button class="phbtn edbtn" id="btn-tidy"  title="Indent the program by its blocks (Shift+Alt+F)">Tidy</button>
          <button class="phbtn" id="btn-lint" title="Check structure">Lint</button>
        </div>
      </div>
      <!-- CodeMirror mounts here -->
      <div id="editor-mount" class="editor-mount"></div>
    </div>

    <!-- ── EMULATOR PANEL ─────────────────────── -->
    <div class="panel panel-emulator" id="emulator-panel">
      <div class="panel-header">
        <span>TS2068 Display</span>
        <div class="panel-header-btns">
          <button class="phbtn" id="btn-zoom-out" title="Smaller screen">−</button>
          <span class="zoom-label" id="zoom-label">2×</span>
          <button class="phbtn" id="btn-zoom-in" title="Larger screen">+</button>
          <button class="phbtn" id="btn-reset-emu">Reset</button>
        </div>
      </div>
      <div class="emulator-body">
        <!-- Focus the screen (click it) to type on the TS2068 keyboard -->
        <div class="bezel" id="ts-bezel" tabindex="0" title="Click to type into a running program">
          <!-- TSRun renders into this canvas -->
          <canvas id="ts-screen"></canvas>
        </div>
        <div class="emu-meta">
          <span id="emu-rom">Leap V2</span>
          <span id="emu-clock">3.528 MHz</span>
          <span id="emu-prog">PROG: —</span>
        </div>
      </div>
    </div>

    <!-- ── DEBUGGER PANEL ─────────────────────── -->
    <div class="panel panel-debugger" id="debugger-panel">
      <div class="panel-header">
        <div class="panel-tabs" role="tablist">
          <button class="panel-tab active" data-tab="debugger">Debugger</button>
          <button class="panel-tab" data-tab="symbols">Symbols</button>
          <button class="panel-tab" data-tab="udg">UDG</button>
          <button class="panel-tab" data-tab="draw">Draw</button>
        </div>
        <div class="panel-header-btns">
          <button class="phbtn" id="btn-refresh-debug" title="Refresh">↺</button>
        </div>
      </div>
      <div class="tab-body" id="debugger-mount" data-tab="debugger"></div>
      <div class="tab-body tool-body" id="tool-symbols" data-tab="symbols" hidden></div>
      <div class="tab-body tool-body" id="tool-udg" data-tab="udg" hidden></div>
      <div class="tab-body tool-body" id="tool-draw" data-tab="draw" hidden></div>
    </div>

  </div><!-- /workspace -->

  <!-- ═══ STATUS BAR ═══════════════════════════════════════════════ -->
  <div class="statusbar">
    <span id="sb-state">Ready</span>
    <span class="sb-sep">·</span>
    <span id="sb-prog">—</span>
    <span class="sb-sep">·</span>
    <span id="sb-cursor">Ln 1, Col 1</span>
    <span class="sb-right" id="sb-rom">Leap V2</span>
  </div>

</div><!-- /ide-root -->
